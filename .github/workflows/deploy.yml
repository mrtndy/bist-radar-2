name: Veriyi tazele ve yayınla

# Bu dosya BIST Radar 2 (mrtndy/bist-radar-2) içindir. Her satırın yanında/üstünde ne işe yaradığı yazılıdır.
# Yerelde sözdizimi kontrolü: python -c "import yaml;yaml.safe_load(open('.github/workflows/deploy.yml',encoding='utf-8'))"

on:                                    # Workflow'u ne tetikler
  schedule:                            # Zamanlanmış koşular (cron, UTC saatiyle)
    # SEANS İÇİ 15 DAKİKALIK KOŞU KAPALI: v1 (bist-radar) hâlâ yayında ve her 15 dakikada Yahoo'yu
    # çağırıyor; v2 de aynısını yaparsa Yahoo trafiği ikiye katlanır ve sınırlama (429) riski artar.
    # v2, v1'in yerini aldığında bu satırın başındaki '#' kaldırılır (bkz. README "BIST Radar 2").
    # 07:00-15:59 UTC = 10:00-18:59 TSİ, hafta içi; BIST seansı 10:00-18:10 TSİ. GitHub cron'u
    # yoğunlukta 5-30 dk gecikir, yani gerçekte 20-45 dk aralıklarla düşer — dakik DEĞİL.
    # - cron: "*/15 7-15 * * 1-5"
    # Kapanış sonrası kesin koşu: 16:00 UTC = 19:00 TSİ, kapanışa ~50 dk pay. TEK aktif zamanlama bu.
    - cron: "0 16 * * 1-5"
  workflow_dispatch: {}                # Actions sekmesinden elle "Run workflow" (dışarıdan da tetiklenebilir)

# Varsayılan izin: yalnızca okuma. Her iş kendi ihtiyacı kadar izni aşağıda ayrıca ister
# (en az yetki ilkesi): build okur, deploy Pages'e yazar, keepalive commit atar.
permissions:
  contents: read

concurrency:                           # Aynı anda tek yayın
  group: pages
  cancel-in-progress: false            # Çalışan yayını iptal etme, sıradakini beklet

env:                                   # Tüm işlerin görebildiği sabitler
  # Yayın alt dizinde olacaksa (kullanici.github.io/repo-adi) basePath gerekir.
  # Kullanıcı sitesinde (kullanici.github.io deposu) boş kalmalı.
  NODE_VERSION: "24"                   # package.json engines ile aynı (Node >= 24, .ts doğrudan çalışır)
  PYTHON_VERSION: "3.12"               # ingest/ingest.py için
  # Ingest sonrası asgari sembol sayısı — altına düşerse BOŞ SİTE YAYINLAMAK YERİNE hata ver.
  MIN_SYMBOLS: "400"

# NOT: Üçüncü taraf eylemler TAM commit SHA'sına sabitlenmiştir (etiketler sonradan başka commit'e
# taşınabilir; SHA taşınamaz). Sürüm yorumda. Güncellemek için:
#   gh api repos/<sahip>/<eylem>/git/ref/tags/<etiket>   (annotated etiketse nesneyi bir kez daha çöz)
jobs:
  build:                               # Veriyi çek, hesapla, statik siteyi derle, artifact yükle
    runs-on: ubuntu-latest
    permissions:
      contents: read                   # yalnızca depoyu okur
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm                   # npm önbelleği (package-lock.json'a göre)

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip                   # pip önbelleği (ingest/requirements.txt'e göre)

      - name: Bağımlılıklar
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install -r ingest/requirements.txt

      # Testler bağımlılıklardan hemen sonra: bozuk kodla Yahoo'ya hiç gitmeden dur.
      - name: Testler
        run: |
          npm test
          python -m unittest discover -s tests -p "test_*.py"

      - name: Hisse evrenini tazele (KAP)
        id: universe
        continue-on-error: true
        run: node scripts/build-universe.ts

      - name: Evren tazelenemediyse depodakini kullan
        if: steps.universe.outcome == 'failure'
        run: |
          # Sebebi VARSAYMA — bir önceki adımın günlüğüne bak. Görülen sebepler: KAP'ın bulut
          # IP'lerini engellemesi, KAP uçlarının değişmesi, ya da script hatası.
          echo "::warning::Evren tazelenemedi (sebep için 'Hisse evrenini tazele' adımının günlüğüne bak); depodaki data/universe.json kullanılıyor. Sektör bilgisi eskimiş olabilir."
          test -s data/universe.json || { echo "::error::Yedek evren dosyası da yok — durduruldu."; exit 1; }

      - name: Barları çek (Yahoo Finance)
        run: |
          for TF in G H S; do
            echo "::group::ingest $TF"
            python ingest/ingest.py --timeframe "$TF"
            echo "::endgroup::"
          done

      # Yahoo bulut IP'lerini sınırlarsa ingest sessizce az sembol yazar. Boş/eksik bir siteyi
      # yayınlamak, eski siteyi bırakmaktan daha kötü — burada durdur.
      - name: Veri bütünlüğü kontrolü
        run: |
          fail=0
          for TF in G H S; do
            n=$(find "data/bars/$TF" -name '*.json' 2>/dev/null | wc -l)
            echo "$TF: $n sembol"
            if [ "$n" -lt "${MIN_SYMBOLS}" ]; then
              echo "::error::$TF için yalnızca $n sembol indi (asgari ${MIN_SYMBOLS}). Yahoo bu sunucuyu sınırlıyor olabilir — yayın durduruldu, mevcut site olduğu gibi kalıyor."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]

      - name: Motor parity testi
        run: node scripts/parity.ts

      # SIRA ÖNEMLİ: build:news, build:data'dan ÖNCE çalışmalı. build:news
      # public/data/news/_counts.json'u yazar, build:data da tablodaki HABER
      # kolonunu oradan doldurur. Ters sırada kolon bir önceki koşunun sayılarını
      # gösterir. Script ağ hatasında boş ama geçerli dosya üretip 0 ile döner,
      # yani KAP erişilemezse site haberler olmadan yine yayınlanır.
      - name: KAP haberlerini çek
        run: npm run build:news

      - name: Tarama JSON'larını üret
        run: npm run build:data

      # Çalışma (study) verisi: yardımcı bir çıktı. Başarısız olursa site yine yayınlanır
      # (continue-on-error), yalnızca study.json eksik kalır.
      - name: Çalışma verisini üret
        continue-on-error: true
        run: node scripts/study.ts --tf G --out public/data/study.json

      - name: Statik siteyi derle
        env:
          # kullanici.github.io deposu kök dizinde servis edilir; diğerleri /repo-adi altında.
          NEXT_PUBLIC_BASE_PATH: ${{ endsWith(github.event.repository.name, '.github.io') && '' || format('/{0}', github.event.repository.name) }}
        run: npm run build

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: out

  deploy:                              # Artifact'ı GitHub Pages'e yayınlar
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write                     # Pages'e yayın izni
      id-token: write                  # deploy-pages'in OIDC ile kimlik doğrulaması için
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # GitHub, 60 gün commit gelmeyen depolarda zamanlanmış işleri otomatik kapatır. Bu iş hiçbir
  # şey commit'lemediği için sayaç dolardı; ayda bir boş commit atarak canlı tutuyoruz.
  keepalive:
    needs: deploy
    permissions:
      contents: write                  # yalnızca bu iş boş commit'i push'layabilir
    # Yalnızca akşam koşusunda ve elle tetiklemede — seans içi 15 dakikalık koşularda
    # (günde ~36 kez) çalıştırmanın anlamı yok.
    if: github.event_name != 'schedule' || github.event.schedule == '0 16 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0               # git log -1 için tam geçmiş
      - name: Son commit 40 günden eskiyse dokun
        run: |
          last=$(git log -1 --format=%ct)
          age=$(( ( $(date +%s) - last ) / 86400 ))
          echo "son commit $age gün önce"
          if [ "$age" -ge 40 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: zamanlanmış işi canlı tut (60 gün kuralı)"
            git push
          fi
